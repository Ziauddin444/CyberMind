services:
  # ── Defender: Flask security ops + honeypots + ML scan ─────────────────────
  flask:
    build:
      context: .
      dockerfile: docker/Dockerfile.flask
    container_name: cm-flask
    hostname: flask
    privileged: true
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      FLASK_ENV: development
      FLASK_DEBUG: "1"
      FLASK_HOST: "0.0.0.0"
      FLASK_PORT: "5000"
      SECRET_KEY: sandbox-dev-key-not-for-prod
      CORS_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173,http://frontend:5173"
      SCAN_PACKET_COUNT: "120"
      SCAN_TIMEOUT_SECONDS: "25"
      OLLAMA_HOST: http://host.docker.internal:11434
    ports:
      - "5000:5000"
      # Honeypot ports published for optional host-side probing
      - "2222:2222"
      - "2323:2323"
      - "8080:8080"
      - "3390:3390"
      - "2121:2121"
      - "3307:3307"
    volumes:
      - ./sandbox-results:/results
      - flask-data:/app/data
    networks:
      cybermind-lab:
        ipv4_address: 10.10.0.10
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:5000/api/health"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 30s

  # ── Auth / JWT backend ─────────────────────────────────────────────────────
  auth:
    build:
      context: .
      dockerfile: docker/Dockerfile.auth
    container_name: cm-auth
    hostname: auth
    environment:
      PORT: "3001"
      EMAIL_METHOD: console
      FRONTEND_URL: http://localhost:5173
    ports:
      - "3001:3001"
    networks:
      - cybermind-lab

  # ── Dashboard (browser on host uses localhost:* published ports) ───────────
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: cm-frontend
    hostname: frontend
    ports:
      - "5173:5173"
    depends_on:
      - auth
      - flask
    networks:
      - cybermind-lab

  # ── Attacker toolkit (nmap / hydra / hping3) ───────────────────────────────
  attacker:
    build:
      context: .
      dockerfile: docker/Dockerfile.attacker
    container_name: cm-attacker
    hostname: attacker
    depends_on:
      flask:
        condition: service_started
    environment:
      TARGET: flask
      OPS_API: http://flask:5000/api
      RESULTS_DIR: /results
    volumes:
      - ./sandbox-results:/results
      - ./docker/sandbox:/attacks:ro
    cap_add:
      - NET_RAW
      - NET_ADMIN
    networks:
      cybermind-lab:
        ipv4_address: 10.10.0.99
    command: ["sleep", "infinity"]

  # ── Optional local AI translator ───────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: cm-ollama
    profiles: ["ai"]
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - cybermind-lab

networks:
  cybermind-lab:
    driver: bridge
    ipam:
      config:
        - subnet: 10.10.0.0/24

volumes:
  flask-data:
  ollama-data:
